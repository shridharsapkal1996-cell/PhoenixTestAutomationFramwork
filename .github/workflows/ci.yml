name: Phoenix Test automation workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  schedule: #Set the CRON for Midnight IST ----->convert in UTC time 
    - cron: "30 18 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options: [qa, uat, dev]
        default: qa 
        required: true
      suiteXmlFile:
        description: "TestNG Xml File"
        type: choice
        options: [testng.xml, smoke.xml, regression.xml]
        default: testng.xml
        required: true

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Execute Test automation framwork
        run: mvn clean test -DsuiteXmlFile="${{ github.event.inputs.suiteXmlFile }}" -Denv="${{ github.event.inputs.env }}"

      - name: Upload a Build Artifact 
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: SureFire Report
          path: target/surefire-reports/
          retention-days: 10
